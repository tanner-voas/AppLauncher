name: Update WorldGen submodule
on:
  repository_dispatch:
    types: [worldgen-updated]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: update-app-submodules
  cancel-in-progress: false
jobs:
  advance-worldgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: true
      - name: Advance pinned WorldGen commit
        env:
          EXPECTED_SHA: ${{ github.event.client_payload.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init -- apps/worldgen
          git -C apps/worldgen fetch origin main
          ACTUAL_SHA="$(git -C apps/worldgen rev-parse FETCH_HEAD)"
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$ACTUAL_SHA" ]]; then
            echo "Newer WorldGen commit $ACTUAL_SHA supersedes notification for $EXPECTED_SHA"
          fi
          git -C apps/worldgen checkout --detach "$ACTUAL_SHA"
          if git diff --quiet -- apps/worldgen; then
            echo "WorldGen submodule already current"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worldgen
          git commit -m "build: update WorldGen submodule to ${ACTUAL_SHA:0:12}"
          git push origin HEAD:main
