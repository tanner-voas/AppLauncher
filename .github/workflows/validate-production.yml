name: Validate and promote production
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [ciyan-updated, worldgen-updated, ascendant-updated, validate-release]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
# All notifications reconcile ALL dependencies. GitHub may replace a pending
# run with a newer event; this cannot drop an individual application's update.
concurrency:
  group: reconcile-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      validated: ${{ steps.reconcile.outputs.validated }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release race and fail-closed behavior
        run: bash tests/release-race.sh
      - name: Reconcile all app pins, validate and atomically promote
        id: reconcile
        shell: bash
        run: bash scripts/reconcile-release.sh
      - name: Save tested bundle for rollback and inspection
        if: steps.reconcile.outputs.validated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ github.run_id }}
          path: dist/
          retention-days: 30
  tag-main:
    needs: release
    if: ${{ always() && needs.release.outputs.validated == 'true' }}
    uses: tanner-voas/iSH-Scripts/.github/workflows/tag-reusable.yml@v0.1.0
    with:
      tool-ref: v0.1.0
