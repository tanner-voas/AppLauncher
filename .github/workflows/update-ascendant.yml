name: Update Ascendant submodule
on:
  repository_dispatch:
    types: [ascendant-updated]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: update-app-submodules
  cancel-in-progress: false
jobs:
  advance-ascendant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Advance pinned Ascendant commit
        env:
          EXPECTED_SHA: ${{ github.event.client_payload.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init -- apps/ascendant
          git -C apps/ascendant fetch origin main
          ACTUAL_SHA="$(git -C apps/ascendant rev-parse FETCH_HEAD)"
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$ACTUAL_SHA" ]]; then
            echo "Newer Ascendant commit $ACTUAL_SHA supersedes notification for $EXPECTED_SHA"
          fi
          git -C apps/ascendant checkout --detach "$ACTUAL_SHA"
          if git diff --quiet -- apps/ascendant; then
            echo "Ascendant submodule already current"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ascendant
          # Validate the staged candidate before creating or publishing the commit.
          sh scripts/verify-release.sh
          git commit -m "build: update Ascendant submodule to ${ACTUAL_SHA:0:12}"
          git push origin HEAD:main
          gh api -X POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=validate-release
